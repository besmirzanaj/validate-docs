openapi: 3.0.3
info:
  title: validate.al API
  description: >-
    Email validation, security scanning and account management, all at
    https://api.validate.al.
  version: "1.0"
servers:
  - url: https://api.validate.al/v1
security:
  - ApiKeyAuth: []
tags:
  - name: Email validation
  - name: Scanning
  - name: Account
  - name: Health
paths:
  /request-scan:
    post:
      tags: [Scanning]
      summary: Request a new scan
      description: >-
        Queues a scan for the given target. The scanner picks it up within
        seconds and the results are available via GET /scans. Counts against
        the plan's daily scan allowance, then scan credits; see Plans and limits.
      operationId: requestScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  description: Hostname or URL to scan.
                  example: example.com
                scan_type:
                  type: string
                  description: Type of scan. Defaults to webapp.
                  enum: [webapp, dns-audit, ip, api]
                  default: webapp
      responses:
        "200":
          description: Scan queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: {type: integer, example: 42}
                  target: {type: string, example: example.com}
                  status: {type: string, example: pending}
                  message: {type: string, example: "Scan queued. Check back for results."}
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: Unknown `scan_type` or missing `target`.
        "429": {$ref: "#/components/responses/LimitReached"}

  /scans:
    get:
      tags: [Scanning]
      summary: List your scans
      description: Returns all scans for the authenticated user, most recent first.
      operationId: listScans
      responses:
        "200":
          description: List of scans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanSummary"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /scans/{scan_id}/report:
    get:
      tags: [Scanning]
      summary: Get scan report
      description: Returns the full JSON report for a completed scan. Only the scan owner may read it.
      operationId: getScanReport
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Full scan report with raw tool output.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: {type: integer}
                  target: {type: string}
                  status:
                    type: string
                    description: Scan status, for example `completed` or `failed`.
                  score:
                    nullable: true
                    allOf: [{$ref: "#/components/schemas/Score"}]
                    description: >-
                      A 0 to 10 guide to how many findings need attention
                      (failed -1.5, warning -0.5 from 10). `null` when the scan
                      type has no ranked checks yet (webapp, ip, api).
                  checks:
                    type: array
                    description: >-
                      One entry per check, in report order, with the same
                      status, wording and next step the portal shows. Empty for
                      scan types the service can't rank yet; `report` still
                      holds the raw output.
                    items: {$ref: "#/components/schemas/Check"}
                  report:
                    type: object
                    description: Full report object (scan metadata + raw tool output).
        "404":
          description: Scan not found, not owned by you, or report not available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /scans/{scan_id}:
    get:
      tags: [Scanning]
      summary: Get one scan
      description: One of your scans with its status. Another account's scan is not found.
      operationId: getScan
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: The scan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScanSummary"
                  - type: object
                    properties:
                      updated_at: {type: string, format: date-time, nullable: true}
        "404":
          description: Scan not found or not yours.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      tags: [Scanning]
      summary: Delete a scan
      description: >-
        Deletes one of your finished scans. It disappears from your lists and
        its report can't be read any more; the scan, report and target are
        removed for good 10 days later (until then validate.al support can
        restore it). It still counts towards the allowance of the day it ran.
        A scan that is pending or in progress can't be deleted.
      operationId: deleteScan
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: {type: integer, example: 42}
        "404":
          description: Scan not found or not yours.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The scan is still pending or in progress.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /me/quota:
    get:
      tags: [Account]
      summary: Plan and what is left today
      description: >-
        Your plan, what is left of today's scan and email check allowances,
        scan credits, welcome checks, and when the allowances reset (00:00 UTC).
      operationId: getQuota
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Plan and allowances.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quota"}

  /account/domains:
    get:
      tags: [Account]
      summary: Verified domains and your verification token
      description: >-
        The per-account token to publish as a DNS TXT record, the record to add,
        the domains already verified, and the email-domain shortcut when it
        applies. An `api` scan only runs against a verified domain.
      operationId: listVerifiedDomains
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Token, record and verified domains.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string, example: vrfy-xxxxxxxxxxxxxxxxxxxxxxxx}
                  record_name: {type: string, example: _validate-al.<your-domain>}
                  record_value: {type: string, example: validate-al-verify=vrfy-xxxx}
                  email_shortcut_domain: {type: string, nullable: true, example: acme.com}
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        domain: {type: string, example: acme.com}
                        method: {type: string, enum: [dns, admin]}
                        verified_at: {type: string, format: date-time}

  /account/domains/verify:
    post:
      tags: [Account]
      summary: Verify a domain via its DNS TXT record
      description: >-
        Looks up `_validate-al.<domain>` live and, when it contains
        `validate-al-verify=<your token>`, records the domain (and its
        subdomains) as verified for your account.
      operationId: verifyDomain
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: {type: string, example: acme.com}
      responses:
        "200": {description: Domain verified.}
        "400": {description: The TXT record wasn't found or didn't match.}
        "422": {description: Not a valid domain.}

  /account/domains/{domain}:
    delete:
      tags: [Account]
      summary: Remove a verified domain
      operationId: deleteVerifiedDomain
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - {name: domain, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Removed (or already absent).}

  /auth/rotate-api-key:
    post:
      tags: [Account]
      summary: Rotate your API key
      description: >-
        Replaces your API key. The old key stops working at once. Needs a portal
        session (the API key can't rotate itself) and, when two-factor
        authentication is on, a current code.
      operationId: rotateApiKey
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                totp_code: {type: string, description: "Required when two-factor authentication is on."}
      responses:
        "200":
          description: New key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: {type: string, example: val-0123456789abcdef0123456789abcdef}
        "401":
          description: No portal session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: Two-factor code missing or wrong.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /auth/register:
    post:
      tags: [Account]
      summary: Create an account
      description: >-
        Registers a new account with email and password and emails a
        confirmation link (valid 24 hours, single use). The account can't sign
        in, and its API key doesn't work, until the address is confirmed.
        Registering again before confirming replaces the password and sends a
        new link.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, example: user@example.com}
                password: {type: string, minLength: 8, example: "••••••••"}
      responses:
        "200":
          description: Account created; a confirmation link was emailed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: {type: string}
                  verification_required: {type: boolean, example: true}
                  message: {type: string, example: Check your email to confirm your address.}
        "400":
          description: Missing or invalid fields.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The address already has a confirmed account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /auth/verify-email:
    post:
      tags: [Account]
      summary: Confirm an email address
      description: >-
        Confirms the address with the token from the emailed link
        (`https://portal.validate.al/verify?token=…`) and signs the account in.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200":
          description: Address confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string, description: JWT Bearer token}
                  api_key: {type: string, description: Your API key}
                  email: {type: string}
        "400":
          description: The link is invalid, already used or expired.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /auth/resend-verification:
    post:
      tags: [Account]
      summary: Send the confirmation link again
      description: >-
        Sends a new link (the earlier one stops working), at most once a
        minute. The answer is the same whether or not the address has an
        account waiting for confirmation.
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}

  /auth/login:
    post:
      tags: [Account]
      summary: Sign in
      description: Authenticates with email and password, returns a JWT.
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, example: user@example.com}
                password: {type: string, example: "••••••••"}
                totp_code: {type: string, description: "Required when two-factor authentication is on."}
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  api_key: {type: string}
                  email: {type: string}
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: >-
            The address isn't confirmed yet (`detail.code` is
            `email_not_verified`), or the account is deactivated.

  /auth/me:
    get:
      tags: [Account]
      summary: Current user
      description: Returns the authenticated user's profile.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  email: {type: string}
                  display_name: {type: string, nullable: true}
                  api_key: {type: string}
                  totp_enabled: {type: boolean}
                  free_scans: {type: integer, description: Scan credits left.}
                  is_admin: {type: boolean}

  /auth/settings:
    put:
      tags: [Account]
      summary: Update profile
      description: Updates display name. Requires JWT session.
      operationId: updateSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, maxLength: 100}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: {type: string}
                  display_name: {type: string, nullable: true}

  /health:
    get:
      tags: [Health]
      summary: API health
      description: Answers 200 when the service is up. No authentication required.
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: validate.al portal}

  /validate_email:
    post:
      tags: [Email validation]
      summary: Validate an email address
      description: >-
        Looks up the domain's MX records and asks the highest-priority mail
        server whether it accepts mail for the address. Can take up to about
        10 seconds when the recipient's mail server is slow. Counts against the
        plan's daily email check allowance, then welcome checks; checks that
        fail on our side (502, `fatal_exception`) don't count. The address is
        not stored.


        The response always carries `verdict` (the answer in words), `score`
        and `issues` (the steps that need attention, with why and what to do).
        Add `?detail=full` to also get `checks`: every step in order with its
        duration and evidence.
      operationId: validateEmail
      parameters:
        - name: detail
          in: query
          required: false
          description: >-
            `full` adds `checks`, the complete list of steps (syntax, domain,
            mx, smtp_connect, rcpt, catch_all and, when used, fallback), each
            with `status`, `summary` and, where measured, `duration_ms` and `evidence`. Without it
            the response stays small, which suits bulk validation.
          schema: {type: string, enum: [full]}
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: The address to check. `Name <user@example.com>` is accepted and reduced to the address.
                  example: someone@example.com
      responses:
        "200":
          description: >-
            The check ran. `status` holds the verdict, including when the
            address can't receive mail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
              examples:
                deliverable:
                  summary: Mail server accepts the address
                  value:
                    cached: false
                    email: someone@example.com
                    status: true
                    verdict: {code: deliverable, label: Deliverable, meaning: The mail server accepted this address., action: Safe to send.}
                    score: {value: 10.0, band: good}
                    issues: []
                refused:
                  summary: Mail server refuses the address
                  value:
                    cached: false
                    email: nobody@example.com
                    status: false
                    verdict: {code: undeliverable, label: Undeliverable, meaning: "The mail server rejected this mailbox, so mail would bounce.", action: Remove or correct the address.}
                    score: {value: 2.0, band: bad}
                    issues:
                      - id: rcpt
                        name: Mailbox check (RCPT TO)
                        status: failed
                        summary: The server rejected nobody@example.com.
                        why: The mailbox does not exist on that server, so mail would bounce.
                        action: Remove or correct this address.
                        owner: Whoever entered the address
                        evidence: {smtp_code: 550}
                        duration_ms: 187
                noDomain:
                  summary: Domain does not exist
                  value:
                    cached: false
                    email: a@no-such-domain.example
                    status: domain_not_found
                    verdict: {code: undeliverable, label: Undeliverable, meaning: "The domain does not exist, so mail cannot reach it.", action: Check for a typo in the domain.}
                    score: {value: 2.0, band: bad}
                    issues:
                      - id: domain
                        name: Domain exists
                        status: failed
                        summary: no-such-domain.example does not exist.
                        why: Mail cannot be delivered to a domain that does not exist.
                        action: Check the address for a typo in the domain.
                        owner: Whoever entered the address
                badFormat:
                  summary: Not an email address
                  value:
                    email: not-an-email
                    status: invalid_format
                    verdict: {code: undeliverable, label: Undeliverable, meaning: This is not a valid email address., action: Correct the address.}
                    score: {value: 2.0, band: bad}
                    issues:
                      - id: syntax
                        name: Syntax
                        status: failed
                        summary: This is not a valid email address.
                        why: An address needs a name, an @ sign and a domain.
                        action: Correct the address before sending.
                        owner: Whoever entered the address
        "400":
          description: Missing `email` field, body is not JSON, or the address can't be parsed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmailError"}
              example: {detail: {error: "Missing 'email' field in request body"}}
        "401":
          description: Missing, wrong, replaced or deactivated API key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmailError"}
              example: {detail: {error: Invalid API key}}
        "429": {$ref: "#/components/responses/LimitReached"}
        "502":
          description: The validation service did not respond. Retry later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: {type: string, example: "Upstream error: timed out"}
  /healthz:
    get:
      tags: [Health]
      summary: Email validator health
      description: Answers `OK` as plain text when the service is up. No API key needed.
      operationId: healthz
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            text/plain:
              schema: {type: string, example: OK}

components:
  responses:
    LimitReached:
      description: >-
        The plan's daily allowance (and any credits or welcome checks) is used
        up. Retry after `Retry-After` seconds, at `resets_at` (00:00 UTC).
      headers:
        Retry-After:
          description: Seconds until the allowance resets.
          schema: {type: integer, example: 3600}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LimitError"}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your validate.al API key, from the portal (Settings → API Key).
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT from sign-in or registration.
  schemas:
    LimitError:
      type: object
      properties:
        detail:
          type: object
          properties:
            error: {type: string, example: "Daily scan limit reached. It resets at 2026-10-05T00:00:00Z."}
            limit: {type: string, enum: [scan, email check]}
            resets_at: {type: string, format: date-time, example: "2026-10-05T00:00:00Z"}
    Allowance:
      type: object
      properties:
        daily_allowance: {type: integer}
        used_today: {type: integer}
        left_today: {type: integer}
    Quota:
      type: object
      properties:
        plan: {type: string, enum: [free, enthusiast, startup, enterprise]}
        unlimited: {type: boolean, description: "True for admins, who aren't limited."}
        resets_at: {type: string, format: date-time}
        scans:
          allOf:
            - $ref: "#/components/schemas/Allowance"
            - type: object
              properties:
                credits: {type: integer, description: Scan credits left; used after the daily allowance.}
        api_scans:
          allOf:
            - $ref: "#/components/schemas/Allowance"
          description: Separate daily allowance for the api scan (Enterprise and admins only; 0 otherwise).
        email_checks:
          allOf:
            - $ref: "#/components/schemas/Allowance"
            - type: object
              properties:
                welcome_left: {type: integer, description: Welcome checks left; used after the daily allowance.}
        total_scans: {type: integer}
        completed_scans: {type: integer}
    ScanSummary:
      type: object
      properties:
        id: {type: integer, example: 42}
        target: {type: string, example: example.com}
        scan_type:
          type: string
          enum: [webapp, dns-audit, ip, api]
        status:
          type: string
          enum: [pending, in_progress, completed, failed, cancelled]
        has_report: {type: boolean}
        summary: {type: string, nullable: true, description: Human-readable findings summary}
        created_at: {type: string, format: date-time, nullable: true}
    ValidationResult:
      type: object
      required: [email, status]
      properties:
        email:
          type: string
          description: The address that was checked.
        status:
          description: >-
            Kept for compatibility. `true` if the mail server accepts the
            address, `false` if it refuses it, or a string when no verdict
            could be reached. Prefer `verdict.code`, which is always one of
            four values.


            | `status` | `verdict.code` | Meaning |

            |---|---|---|

            | `true` | `deliverable` (or `risky`) | The mail server accepted the mailbox. `risky` when the server accepts every address (catch-all). |

            | `false` | `undeliverable` | The mail server rejected the mailbox. |

            | `invalid_format` | `undeliverable` | Not a valid address. |

            | `domain_not_found` | `undeliverable` | The domain does not exist. |

            | `no_mx_records` | `undeliverable` | The domain has no mail servers. |

            | `smtp_connect_error` | `unknown` | Could not connect to the mail server. |

            | `smtp_timeout` | `unknown` | The mail server did not answer in time. |

            | `blocked_by_provider` | `unknown` | The provider refused to answer verification probes. |

            | `fatal_exception` | `unknown` | Internal error; retry later. |
          oneOf:
            - type: boolean
            - type: string
              enum: [invalid_format, domain_not_found, no_mx_records, smtp_connect_error, smtp_timeout, blocked_by_provider, fatal_exception]
        cached:
          type: boolean
          description: True when served from a recent identical check. Absent when the format check failed.
        source:
          type: string
          description: >-
            Present when a second verification provider decided the result
            because the recipient's server blocked our check, for example
            `zerobounce`.
        verdict:
          type: object
          required: [code, label, meaning, action]
          properties:
            code: {type: string, enum: [deliverable, undeliverable, risky, unknown]}
            label: {type: string}
            meaning: {type: string, description: What the result means in plain language.}
            action: {type: string, description: What to do with the address.}
        score:
          $ref: "#/components/schemas/Score"
        issues:
          type: array
          description: Steps that need attention (status `warning`, `failed` or `unknown`). Empty when the check is clean.
          items: {$ref: "#/components/schemas/Check"}
        checks:
          type: array
          description: Every step in order. Only with `?detail=full`.
          items: {$ref: "#/components/schemas/Check"}
    Score:
      type: object
      required: [value, band]
      description: A guide, not a guarantee.
      properties:
        value: {type: number, minimum: 0, maximum: 10}
        band: {type: string, enum: [good, warn, bad]}
    Check:
      type: object
      required: [id, name, status, summary]
      properties:
        id: {type: string, description: Stable identifier of the check.}
        name: {type: string}
        status:
          type: string
          enum: [passed, warning, failed, info, unknown, skipped]
          description: >-
            `info` is informational and earns no points; `unknown` could not
            be decided; `skipped` did not run because an earlier step failed.
        summary: {type: string, description: "What was found, in plain language."}
        description: {type: string, description: What this check looks at. Scan checks only.}
        why: {type: string, description: Why it matters. Only on checks that need attention.}
        action: {type: string, description: What to do. Only on checks that need attention.}
        owner: {type: string, description: Who can fix it. Only on checks that need attention.}
        evidence: {type: object, description: "Facts behind the result, for example the SMTP reply code or the flagged findings."}
        duration_ms: {type: integer, nullable: true, description: "Time the step took. Always null for scan checks today."}
        cached: {type: boolean, description: "True when an email step is replayed from a recent identical check."}
    Error:
      description: Errors from scanning and account endpoints.
      type: object
      properties:
        detail: {type: string, description: Error message}
    EmailError:
      description: Errors from the email validator.
      type: object
      properties:
        detail:
          type: object
          properties:
            error: {type: string}
